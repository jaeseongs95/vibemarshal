name: CI

on:
  push:
    branches: ["main", "develop", "release/**", "feature/**", "fix/**"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

jobs:
  engine-tests:
    name: Engine Unit Tests
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "setuptools>=77" wheel cryptography==50.0.1 openai-codex==0.147.0 pydantic==2.13.5

      - name: Run full Engine and repository unit test suite
        env:
          PYTHONPATH: src
          PYTHONUTF8: "1"
        run: |
          C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe -NoProfile -NonInteractive -Command '[Security.Principal.WindowsIdentity]::GetCurrent().User.Value | Out-Null'
          python -m unittest discover -s tests -p "test_*.py"

  desktop-tests:
    name: Desktop Vitest and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          npm install -g pnpm
          pnpm install --no-frozen-lockfile

      - name: Run Vitest and Build
        run: |
          pnpm test
          pnpm run build
