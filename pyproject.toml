[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "flowmarshal-engine"
version = "0.2.0a1"
description = "검증 가능한 계획·분배·추적을 위한 FlowMarshal 개발 엔진"
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
  "License :: OSI Approved :: Apache Software License",
]
requires-python = ">=3.10"
dependencies = [
  "openai-codex==0.147.0",
  "pydantic==2.13.5",
]

[project.scripts]
flowmarshal-engine = "flowmarshal.engine.console_host:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["flowmarshal", "flowmarshal.engine"]
include-package-data = false
