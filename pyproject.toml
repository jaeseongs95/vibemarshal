[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "flowmarshal-engine"
version = "0.2.0a1"
description = "검증 가능한 계획·분배·추적을 위한 FlowMarshal 개발 엔진"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai-codex==0.147.0",
  "pydantic==2.13.5",
]

[project.scripts]
flowmarshal-engine = "flowmarshal.engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["flowmarshal", "flowmarshal.engine", "flowmarshal.engine.*"]
